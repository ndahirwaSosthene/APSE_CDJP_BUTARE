services:
  - type: web
    name: apse-cdjp-butare
    runtime: python
    plan: free # Can be upgraded to starter if attaching persistent disk
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py --host 0.0.0.0 --port $PORT --no-browser
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APSE_HOST
        value: 0.0.0.0
      - key: APSE_DATA_DIR
        value: /opt/render/project/src/data/runtime_store
    healthCheckPath: /apse-service/health
    autoDeploy: true

